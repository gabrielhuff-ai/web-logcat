<!DOCTYPE html>
<html lang="en" data-theme="dark" data-accent="indigo" data-glass="on">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WebLogcat — Scripting widget · design spec</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    /* The canvas root keeps its warm-gray background; we override body so
       the dark widget tokens we render inside artboards don't bleed into it. */
    html, body { background: #f0eee9; }
    body { font-family: "Inter", system-ui, sans-serif; }

    /* A wrapper that mimics the dashboard's surface behind a tile so the
       glass-on-tile reads correctly. */
    .tile-stage {
      position: relative;
      width: 100%; height: 100%;
      padding: 16px;
      background:
        radial-gradient(circle at 18% 0%, oklch(from var(--accent) calc(l - 0.3) c h / 0.22), transparent 55%),
        radial-gradient(circle at 88% 100%, oklch(0.4 0.14 280 / 0.16), transparent 50%),
        var(--bg-0);
      border-radius: var(--r-lg);
      overflow: hidden;
      font-family: var(--font-mono);
    }
    .tile-stage.light {
      background:
        radial-gradient(circle at 18% 0%, oklch(from var(--accent) calc(l + 0.05) c h / 0.20), transparent 55%),
        var(--bg-0);
    }
    .tile-stage.flat { background: var(--bg-0); }

    /* Section header chip lookups */
    .spec-note {
      background: oklch(0.97 0.005 80);
      border-radius: 12px;
      padding: 22px 26px;
      font-family: "Inter", system-ui, sans-serif;
      color: #2a251f;
      font-size: 13px;
      line-height: 1.55;
      border: 1px solid rgba(0,0,0,0.06);
      box-shadow: 0 1px 0 rgba(255,255,255,0.5) inset, 0 4px 18px rgba(0,0,0,0.04);
      overflow: auto;
      width: 100%; height: 100%;
    }
    .spec-note h2 {
      margin: 0 0 10px;
      font-size: 15px;
      font-weight: 700;
      color: #1a1611;
      letter-spacing: -0.01em;
    }
    .spec-note h3 {
      margin: 16px 0 6px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #7c6a4d;
    }
    .spec-note p { margin: 0 0 8px; }
    .spec-note ul { margin: 0 0 8px; padding-left: 18px; }
    .spec-note li { margin: 3px 0; }
    .spec-note code, .spec-note kbd {
      font-family: "JetBrains Mono", monospace;
      font-size: 11.5px;
      background: rgba(0,0,0,0.05);
      padding: 1px 5px;
      border-radius: 3px;
      color: #5a4a2a;
    }
    .spec-note .accent { color: oklch(0.50 0.16 268); font-weight: 600; }
    .spec-note .lede {
      font-size: 14px;
      color: #3a3024;
      margin-bottom: 12px;
      line-height: 1.55;
    }
    .spec-note .twocol {
      display: grid; grid-template-columns: 1fr 1fr; gap: 18px;
    }

    /* Wireframe palette (used in the wireframe section) */
    .wire {
      width: 100%; height: 100%;
      background: #f7f5f0;
      border-radius: 10px;
      border: 1.5px solid #2a251f;
      padding: 14px;
      font-family: "JetBrains Mono", monospace;
      color: #2a251f;
      display: flex; flex-direction: column; gap: 8px;
      overflow: hidden;
    }
    .wire-head {
      display: flex; align-items: center; gap: 8px;
      padding-bottom: 8px;
      border-bottom: 1.5px solid #2a251f;
      font-weight: 700;
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .wire-block {
      border: 1.5px dashed #80715a;
      border-radius: 6px;
      padding: 8px 10px;
      font-size: 11px;
      color: #4a3f2e;
      display: flex; align-items: center; gap: 6px;
    }
    .wire-block.solid { border-style: solid; }
    .wire-block.cap { background: rgba(255,255,255,0.6); font-weight: 600; color: #2a251f; }
    .wire-row { display: flex; gap: 6px; }
    .wire-row > * { flex: 1; }
    .wire-stack { display: flex; flex-direction: column; gap: 6px; flex: 1; }
    .wire-fill { flex: 1; }
    .wire-anno {
      font-size: 10px; color: #80715a;
      font-style: italic; margin-top: 2px; letter-spacing: 0.02em;
    }

    /* Catalog cell — for the per-control state grid */
    .cat-cell {
      display: flex; flex-direction: column;
      background: var(--bg-0);
      border-radius: 8px;
      padding: 14px 14px 12px;
      min-height: 100px;
      position: relative;
      /* Make floating labels (text/select/stepper) blend with the cell bg */
      --sc-label-bg: var(--bg-0);
    }
    .cat-cell-label {
      position: absolute;
      top: 8px; right: 10px;
      font-size: 9px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--fg-3);
      font-family: var(--font-mono);
    }
    .cat-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      width: 100%; height: 100%;
      padding: 18px;
      background:
        radial-gradient(circle at 18% 0%, oklch(from var(--accent) calc(l - 0.3) c h / 0.22), transparent 55%),
        var(--bg-0);
      border-radius: var(--r-lg);
      overflow: auto;
    }
    .cat-title {
      grid-column: 1 / -1;
      display: flex; align-items: center; justify-content: space-between;
      font-family: var(--font-mono);
      color: var(--fg-0);
      padding: 6px 4px 8px;
      border-bottom: 1px solid var(--glass-line);
      margin-bottom: 4px;
    }
    .cat-title-main { font-size: 14px; font-weight: 600; letter-spacing: -0.005em; }
    .cat-title-sub { font-size: 11px; color: var(--fg-3); font-family: var(--font-mono); }

    /* Iconography preview */
    .icon-strip {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      gap: 10px;
      padding: 18px;
      width: 100%; height: 100%;
      background: var(--bg-0);
      border-radius: var(--r-lg);
      overflow: auto;
    }
    .icon-tile {
      display: flex; flex-direction: column; align-items: center; gap: 6px;
      padding: 14px 8px;
      background: var(--bg-1);
      border: 1px solid var(--glass-line);
      border-radius: 8px;
      color: var(--fg-0);
      font-family: var(--font-mono);
    }
    .icon-tile-glyph {
      width: 32px; height: 32px;
      display: inline-flex; align-items: center; justify-content: center;
      border-radius: 7px;
      background: oklch(from var(--accent) l c h / 0.14);
      color: var(--accent);
    }
    .icon-tile-name { font-size: 11px; color: var(--fg-1); }
    .icon-tile-tag {
      font-size: 9px; padding: 1px 6px; border-radius: 3px;
      background: var(--bg-2); color: var(--fg-3);
      text-transform: uppercase; letter-spacing: 0.08em;
    }
    .icon-tile-tag.new { background: oklch(from var(--accent) l c h / 0.2); color: var(--accent-fg); }

    /* Common stage wrapper for the builder modal artboards */
    .builder-bg {
      width: 100%; height: 100%;
      padding: 20px;
      background:
        radial-gradient(circle at 30% 0%, oklch(from var(--accent) calc(l - 0.3) c h / 0.18), transparent 60%),
        radial-gradient(circle at 90% 100%, oklch(0.4 0.14 280 / 0.14), transparent 50%),
        var(--bg-0);
      border-radius: var(--r-lg);
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="design-canvas.jsx"></script>
  <script type="text/babel" src="icons.jsx"></script>
  <script type="text/babel" src="scripting-controls.jsx"></script>
  <script type="text/babel" src="scripting-panel.jsx"></script>
  <script type="text/babel" src="scripting-builder.jsx"></script>
  <script type="text/babel" src="scripting-canvas.jsx"></script>
</body>
</html>
