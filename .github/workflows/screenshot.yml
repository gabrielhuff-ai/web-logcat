name: Capture screenshot

# Refreshes the README screenshot whenever main changes (and on demand
# from the Actions tab). Branch protection on `main` blocks direct
# pushes from `GITHUB_TOKEN`, so the workflow opens a PR with the
# refreshed image instead of committing on top. The PR auto-merges
# once required checks pass (gated on the same `Allow auto-merge`
# repo setting `screenshot.yml` itself depends on).

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/screenshot.png'
      - 'README.md'
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: screenshot
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - run: npm run build

      - name: Render screenshot
        run: |
          # Serve the production-shape build at the root so the script's
          # default URL (http://localhost:4173/) hits it directly.
          npm run preview -- --port 4173 --strictPort &
          PREVIEW_PID=$!
          # Wait for the server to be ready (max 30s) before shooting.
          until curl -sf http://localhost:4173/ > /dev/null; do
            sleep 0.5
          done
          node scripts/capture-screenshot.mjs
          kill "$PREVIEW_PID" 2>/dev/null || true

      - name: Open PR if screenshot changed
        id: pr
        uses: peter-evans/create-pull-request@v7
        with:
          # Use the long-lived PAT so the resulting PR triggers CI;
          # `GITHUB_TOKEN`-authored PRs are silently suppressed under
          # GitHub's anti-recursion rule, leaving the PR with no green
          # check and stalling auto-merge forever.
          token: ${{ secrets.BOT_PAT }}
          # Stable branch name so re-runs update the same PR rather than
          # spawning new ones; the action force-pushes the latest
          # screenshot onto it.
          branch: ci/screenshot-refresh
          base: main
          commit-message: 'ci: refresh README screenshot'
          title: 'ci: refresh README screenshot'
          body: |
            Auto-generated from
            [`screenshot.yml`](.github/workflows/screenshot.yml). Closes
            and reopens whenever the rendered dashboard differs from the
            version checked in. Safe to merge — only `docs/screenshot.png`
            changes.
          add-paths: docs/screenshot.png
          author: 'github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>'
          committer: 'github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>'
          delete-branch: true

      - name: Enable auto-merge
        if: steps.pr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ secrets.BOT_PAT }}
        run: |
          gh pr merge ${{ steps.pr.outputs.pull-request-number }} --auto --squash --delete-branch
