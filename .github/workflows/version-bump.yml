name: Version bump

# Auto-increments the patch version on every push to `main`. Major /
# minor bumps stay manual: bump them in `package.json` as part of the
# PR that warrants them, and the next push to main will pick the next
# patch from there.
#
# Branch protection on `main` blocks direct `GITHUB_TOKEN` pushes, so
# the workflow opens a PR with the bump commit and enables auto-merge.
# `BOT_PAT` (a fine-grained PAT with Contents:Write + Pull requests:
# Write) is used so the resulting PR triggers CI — `GITHUB_TOKEN` would
# be silently suppressed under GitHub's anti-recursion rule.
#
# Loop protection: skip when the head commit is itself a bump. Squash
# merges of the bump PR put the PR title verbatim onto `main`, so the
# `startsWith` check on the commit message catches the next iteration.

# Loop protection:
#   - The bump PR's squash-merge commit message contains
#     `chore: bump patch version` (it's the PR title verbatim, plus any
#     `(#NN)` suffix GitHub adds). The `contains` guard skips the next
#     iteration regardless of whether the repo's squash setting puts the
#     PR title at byte 0 or buries it inside a "title + details" message.
#   - `concurrency` serialises bump runs so two near-simultaneous pushes
#     to main can't both try to publish the same patch number.

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: version-bump
  cancel-in-progress: false

jobs:
  bump:
    if: |
      !contains(github.event.head_commit.message, 'chore: bump patch version')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.BOT_PAT }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Bump patch version
        id: bump
        run: |
          NEW_VERSION=$(npm version patch --no-git-tag-version)
          echo "version=${NEW_VERSION#v}" >> "$GITHUB_OUTPUT"

      - name: Open PR and enable auto-merge
        env:
          GH_TOKEN: ${{ secrets.BOT_PAT }}
        run: |
          BRANCH="auto/bump-${{ steps.bump.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add package.json package-lock.json
          git commit -m "chore: bump patch version to ${{ steps.bump.outputs.version }}"
          git push origin "$BRANCH"
          PR_URL=$(gh pr create \
            --title "chore: bump patch version to ${{ steps.bump.outputs.version }}" \
            --body "Automated patch version bump triggered by ${{ github.sha }}." \
            --head "$BRANCH" --base main)
          gh pr merge "$PR_URL" --auto --squash --delete-branch
