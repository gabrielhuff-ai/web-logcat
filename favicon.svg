  <rect x="12" y="0"  width="8" height="8" rx="1.5" fill="#8b85f2" fill-opacity="0.7" />
  <rect x="6"  y="12" width="8" height="8" rx="1.5" fill="#8b85f2" fill-opacity="0.4" />
</svg>
